<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Lâmina frase do dia</title>
<style>
@font-face{font-family:"Fraunces";font-weight:600;src:url(data:font/woff2;base64,__FONT__) format("woff2");}
html,body{margin:0;padding:0;background:#1b1a2e}
#card{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:-apple-system,"Segoe UI",sans-serif}
#card svg.bg{position:absolute;inset:0;width:1080px;height:1350px}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,16,40,.55) 0%,rgba(18,16,40,.25) 38%,rgba(18,16,40,0) 55%)}
.txt{position:absolute;left:96px;right:96px;top:120px;height:560px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#FFF8EC}
.mark{font-family:"Fraunces",Georgia,serif;font-size:120px;line-height:.6;color:#F2C27A;opacity:.9;margin-bottom:26px}
#q{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:64px;line-height:1.22;letter-spacing:-.005em;margin:0;text-shadow:0 2px 18px rgba(10,8,30,.45)}
.rule{width:72px;height:2px;background:#F2C27A;margin:40px auto 22px}
.au{font-size:30px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#FFF8EC}
.ob{font-size:24px;color:#F6E3C6;margin-top:8px;letter-spacing:.02em}
</style>
<style>#card{height:1920px!important;background:#1F1D45}#card svg.bg{top:570px!important}.txt{top:330px!important;height:620px!important}</style></head>
<body>
<div id="card">
<svg class="bg" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F1D45"/>
      <stop offset=".38" stop-color="#5B3F6E"/>
      <stop offset=".62" stop-color="#C8705A"/>
      <stop offset=".80" stop-color="#F0A866"/>
      <stop offset="1" stop-color="#F7CF8E"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3C4A7A"/>
      <stop offset="1" stop-color="#1A2148"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF1C9"/>
      <stop offset=".55" stop-color="#FCD58C"/>
      <stop offset="1" stop-color="#F6B46B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#sky)"/>
  <g fill="#FFF8EC" opacity=".7">
    <circle cx="120" cy="80" r="2"/><circle cx="300" cy="150" r="1.5"/><circle cx="520" cy="60" r="2"/>
    <circle cx="760" cy="120" r="1.5"/><circle cx="960" cy="70" r="2"/><circle cx="880" cy="220" r="1.4"/>
    <circle cx="210" cy="260" r="1.3"/><circle cx="640" cy="200" r="1.2"/>
  </g>
  <circle cx="770" cy="1000" r="230" fill="url(#sun)"/>
  <circle cx="770" cy="1000" r="92" fill="#FFE6B0"/>
  <path d="M0 985 L120 930 L230 960 L360 905 L470 950 L560 925 L680 965 L800 935 L930 970 L1080 930 L1080 1010 L0 1010Z" fill="#7A4F6E" opacity=".75"/>
  <rect y="1005" width="1080" height="345" fill="url(#sea)"/>
  <g stroke="#FCD58C" stroke-linecap="round" opacity=".55">
    <path d="M690 1030h160" stroke-width="4"/><path d="M710 1060h120" stroke-width="3"/>
    <path d="M730 1092h80" stroke-width="3"/><path d="M745 1125h50" stroke-width="2"/>
  </g>
  <path d="M0 1350 L0 1010 C60 990 140 980 230 985 C330 990 420 1005 470 1040 C520 1080 540 1150 560 1350Z" fill="#241B33"/>
  <g fill="#2E2340">
    <rect x="70" y="955" width="380" height="16"/>
    <rect x="58" y="971" width="404" height="16"/>
    <g>
      <rect x="92" y="815" width="26" height="140"/><rect x="146" y="815" width="26" height="140"/>
      <rect x="200" y="815" width="26" height="140"/><rect x="254" y="815" width="26" height="140"/>
      <rect x="308" y="815" width="26" height="140"/><rect x="362" y="815" width="26" height="140"/>
    </g>
    <g><rect x="86" y="805" width="38" height="10"/><rect x="140" y="805" width="38" height="10"/>
      <rect x="194" y="805" width="38" height="10"/><rect x="248" y="805" width="38" height="10"/>
      <rect x="302" y="805" width="38" height="10"/><rect x="356" y="805" width="38" height="10"/></g>
    <rect x="72" y="782" width="334" height="23"/>
    <path d="M64 782 L239 715 L414 782Z"/>
    <rect x="420" y="890" width="24" height="65"/>
    <rect x="414" y="882" width="36" height="9"/>
  </g>
  <g fill="none" stroke="#3A2E47" stroke-width="5" stroke-linecap="round">
    <path d="M1080 1210 C1000 1190 930 1150 880 1090"/>
  </g>
  <g fill="#3A2E47">
    <ellipse cx="1030" cy="1192" rx="34" ry="11" transform="rotate(-25 1030 1192)"/>
    <ellipse cx="990" cy="1168" rx="32" ry="10" transform="rotate(35 990 1168)"/>
    <ellipse cx="955" cy="1145" rx="30" ry="10" transform="rotate(-35 955 1145)"/>
    <ellipse cx="920" cy="1118" rx="28" ry="9" transform="rotate(40 920 1118)"/>
    <ellipse cx="895" cy="1095" rx="24" ry="8" transform="rotate(-50 895 1095)"/>
    <circle cx="968" cy="1180" r="9"/><circle cx="932" cy="1140" r="8"/>
  </g>
  <g fill="none" stroke="#2E2340" stroke-width="3" stroke-linecap="round">
    <path d="M610 760 q14 -12 26 0 q12 -12 26 0"/><path d="M670 720 q10 -9 20 0 q10 -9 20 0"/>
  </g>
</svg>
<div class="veil"></div>
<div class="txt">
  <div class="mark">“</div>
  <p id="q">{{FRASE}}</p>
  <div class="rule"></div>
  <div class="au">{{AUTOR}}</div>
  <div class="ob">{{OBRA}}</div>
</div>
</div>
<script>
(function(){try{var box=document.querySelector('.txt'),q=document.getElementById('q'),s=64;
while(box.scrollHeight>box.clientHeight&&s>34){s-=2;q.style.fontSize=s+'px';}}catch(e){}})();
</script>
</body>
</html>
